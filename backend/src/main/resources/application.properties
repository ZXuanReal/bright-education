spring.application.name=bright-english-portal
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bright_english_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:bright}
spring.datasource.password=${DB_PASSWORD:bright123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=220MB

app.jwtSecret=${JWT_SECRET:change-me-very-long-secret-key-please-use-env}
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
app.uploadDir=${UPLOAD_DIR:./uploads}
app.baseUrl=${APP_BASE_URL:http://localhost:8080}
app.twilio.accountSid=${TWILIO_ACCOUNT_SID:}
app.twilio.authToken=${TWILIO_AUTH_TOKEN:}
app.twilio.verifyServiceSid=${TWILIO_VERIFY_SERVICE_SID:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.trust=${SMTP_SSL_TRUST:}

spring.web.resources.static-locations=file:${app.uploadDir}/,classpath:/static/

logging.level.org.springframework.security=INFO
logging.level.com.brightenglish.portal=DEBUG
