services:
  mysql:
    image: mysql:8.0
    container_name: bright-english-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bright_english_portal}
      MYSQL_USER: ${MYSQL_USER:-bright}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bright123}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin@123}
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: bright-english-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-bright_english_portal}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-bright}
      DB_PASSWORD: ${MYSQL_PASSWORD:-bright123}
      JWT_SECRET: ${JWT_SECRET:-bright-english-local-dev-secret-change-before-deploy}
      UPLOAD_DIR: /uploads
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
    volumes:
      - uploads_data:/uploads

  frontend:
    build:
      context: ./frontend
    container_name: bright-english-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:5173'
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api

volumes:
  mysql_data:
  uploads_data:
